[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-tool-backend"
version = "0.1.0"
description = "Hosted transcript annotation backend"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.83",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "psycopg[binary]==3.3.4",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.52",
    "sqlmodel==0.0.42",
    "uvicorn==0.52.4",
]

[project.scripts]
annotationctl = "hosted_app.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["hosted_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "hosted_app.main:app"
